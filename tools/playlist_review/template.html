<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAKTOR ML</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --fusion-0: #4a3aa7; --fusion-1: #eda100; --fusion-2: #008300; --fusion-3: #e87ba4;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --context-dot: #c3c2b7; --accent-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --fusion-0: #9085e9; --fusion-1: #c98500; --fusion-2: #008300; --fusion-3: #d55181;
    --context-dot: #4a4a46;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --fusion-0: #9085e9; --fusion-1: #c98500; --fusion-2: #008300; --fusion-3: #d55181;
  --context-dot: #4a4a46;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
button:hover:not(:disabled) { background: var(--wash); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--series-1); border-color: var(--series-1); color: var(--accent-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--series-1); }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, .pl:focus-visible, [role="switch"]:focus-visible, .menu button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
input[type="search"], input[type="text"], select { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; }
.app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr auto; height: 100vh; }
header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
header h1 { font-size: 16px; margin: 0; }
.summary { color: var(--ink-2); }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.spacer { flex: 1; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px 4px 6px; background: var(--surface-1); }
.switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--baseline); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-1); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.switch[aria-checked="true"] .track { background: var(--series-1); }
.switch[aria-checked="true"] .track::after { left: 16px; }
.switch small { display: block; color: var(--muted); font-size: 11px; line-height: 1.2; }
aside { overflow: auto; border-right: 1px solid var(--border); background: var(--surface-1); padding: 8px 0; }
.orginfo { padding: 4px 14px 10px; border-bottom: 1px solid var(--grid); margin-bottom: 6px; font-size: 13px; }
.orginfo summary { cursor: pointer; color: var(--ink-2); }
.orginfo ol { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); }
.folder > summary { list-style: none; cursor: pointer; padding: 6px 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.folder > summary::-webkit-details-marker { display: none; }
.folder > summary .n { font-weight: 400; margin-left: auto; font-variant-numeric: tabular-nums; }
.pl { display: flex; gap: 8px; align-items: baseline; padding: 4px 14px 4px 28px; cursor: pointer; }
.pl:hover { background: var(--wash); }
.pl.sel { background: var(--wash); box-shadow: inset 3px 0 0 var(--series-2); }
.pl .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.star { color: var(--ink-2); font-size: 12px; }
.badge { font-size: 12px; white-space: nowrap; }
.badge i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
main { overflow: auto; padding: 12px 16px 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.maphead { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.legend span.ring::before { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.hl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
#mapWrap { position: relative; }
#map { width: 100%; height: 400px; display: block; touch-action: none; }
#tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; max-width: 340px; z-index: 5; }
#tip b { display: block; font-weight: 600; }
h2 { font-size: 16px; margin: 0; }
h3 { font-size: 14px; margin: 0 0 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.chip { background: var(--wash); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink-2); }
.verdict { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.verdict button[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); font-weight: 600; }
.verdict button i { font-style: normal; color: var(--c); margin-right: 4px; font-weight: 700; }
textarea { width: 100%; min-height: 40px; margin-top: 8px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 3px var(--c); margin: 0 4px 0 2px; }
.fusion { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
.fusion .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fusion ul { margin: 6px 0 0; padding-left: 22px; }
.fusion li { margin: 2px 0; }
.fusion li button { padding: 0 6px; border: 0; background: none; color: var(--muted); }
.status { font-size: 12px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--border); color: var(--ink-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface-1); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.playing td { background: var(--wash); }
tr.flagged td.title { text-decoration: line-through; color: var(--muted); }
td .play, td .more { padding: 2px 8px; border-radius: 6px; }
.title small { display: block; color: var(--muted); font-size: 11px; }
.flag { display: inline-block; margin-left: 6px; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); }
footer { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: var(--surface-1); border-top: 1px solid var(--border); }
#now { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
progress { width: 180px; height: 6px; }
.warn { border-left: 3px solid var(--warning); padding: 6px 10px; background: var(--wash); border-radius: 6px; margin-bottom: 12px; display: none; }
.help { font-size: 13px; color: var(--ink-2); }
.help li { margin: 3px 0; }
/* menú contextual */
.menu { position: fixed; z-index: 50; min-width: 240px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: none; }
.menu .mhead { padding: 4px 8px 6px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--grid); margin-bottom: 4px; max-width: 320px; }
.menu button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 7px 10px; background: none; }
.menu button:hover:not(:disabled) { background: var(--wash); }
.menu .note { padding: 6px 10px; font-size: 12px; color: var(--muted); }
/* ventanas */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.42); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
.dialog { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.dialog h2 { margin-bottom: 8px; }
.dialog p { margin: 8px 0; color: var(--ink-2); }
.dialog .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.dialog .path { font: 12px/1.4 ui-monospace, Consolas, monospace; background: var(--wash); border-radius: 6px; padding: 6px 8px; word-break: break-all; }
.dialog ol, .dialog ul { color: var(--ink-2); padding-left: 20px; }
.callout { border-left: 3px solid var(--c, var(--series-1)); background: var(--wash); border-radius: 6px; padding: 8px 10px; margin: 10px 0; }
.steps { list-style: none; padding: 0; margin: 10px 0; }
.steps li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; color: var(--muted); }
.steps li.done { color: var(--ink-2); }
.steps li.cur { color: var(--ink); font-weight: 600; }
.steps li .ic { width: 16px; text-align: center; flex: none; }
.bar { height: 8px; border-radius: 999px; background: var(--wash); overflow: hidden; margin: 6px 0; }
.bar > div { height: 100%; background: var(--series-1); width: 0; transition: width .4s; }
.bar.indet > div { width: 30%; animation: indet 1.4s infinite ease-in-out; }
@keyframes indet { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 240px 1fr auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>TRAKTOR ML</h1>
    <span id="summary" class="summary"></span>
    <label class="ink2" id="orgSelWrap" hidden>Organización <select id="orgSel"></select></label>
    <span class="spacer"></span>
    <div class="toolbar" id="toolbar"></div>
    <button id="helpBtn" aria-expanded="false">Ayuda</button>
  </header>
  <aside id="side" aria-label="Carpetas y playlists"></aside>
  <main>
    <div id="audioWarn" class="warn">No puedo reproducir los temas desde acá.</div>
    <div id="help" class="card help" hidden></div>
    <section class="card" aria-label="Mapa de temas">
      <div class="maphead">
        <strong>Mapa de tu música</strong>
        <span class="muted">(cada punto es un tema; los que están cerca suenan parecido)</span>
      </div>
      <div class="maphead">
        <div class="legend" id="legend"></div>
      </div>
      <div class="hl">
        <label class="ink2">Mostrar en el mapa <select id="hlSel">
          <option value="">—</option>
          <option value="new">temas agregados recientemente</option>
          <option value="fused">temas en fusiones</option>
        </select></label>
        <input id="hlText" type="search" placeholder="o buscar tema, artista o carpeta" style="width:min(100%, 300px)" aria-label="Buscar en el mapa">
        <span id="hlCount" class="muted" aria-live="polite"></span>
      </div>
      <div id="mapWrap"><canvas id="map" aria-label="Mapa 2D de los temas; las tablas tienen los mismos datos"></canvas><div id="tip" role="status"></div></div>
    </section>
    <section class="card" id="fusionCard" aria-label="Fusiones de temas"></section>
    <section class="card" id="plCard" aria-live="polite"></section>
  </main>
  <footer>
    <button id="pauseBtn" aria-label="Pausa">Pausa</button>
    <button id="nextBtn" aria-label="Siguiente">Siguiente →</button>
    <button id="nowMenuBtn" disabled title="Opciones del tema que está sonando">⋯ Este tema</button>
    <span id="now" class="ink2">Nada sonando.</span>
    <progress id="prog" max="1" value="0"></progress>
  </footer>
</div>
<div class="menu" id="menu" role="menu"></div>
<div class="overlay" id="overlay"><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div></div>
<audio id="audio" preload="none"></audio>
<script>
const DATA = /*__DATA__*/null;
const APP = DATA.app || null;   // null = página suelta (solo revisar); con la app se pueden hacer cambios
const STORE_KEY = "traktor_playlist_review_v1_" + DATA.dataset;
const PREFS_KEY = "traktor_prefs_v1";
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
};
const fmt = n => n.toLocaleString("es");
const T = DATA.tracks;
const byU = new Map(T.map((t, i) => [t.u, i]));
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { state = {}; }
let prefs = { keep: true };
try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")); } catch (e) {}
const firstVisit = !Object.keys(state).length;
// Opiniones dadas sobre la corrida original pasan a la organización importada de ella
DATA.orgs.forEach(o => (o.legacy || []).forEach(h => {
  if (!state[o.id] && state[h]) {
    state[o.id] = {};
    for (const [pid, j] of Object.entries(state[h])) state[o.id][o.id + pid.slice(h.length)] = j;
  }
}));
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
const savePrefs = () => { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} };
const judg = (orgId, plId) => ((state[orgId] ||= {})[plId] ||= { verdict: "", note: "", notHere: [] });

let org = DATA.orgs[0], folder = null, playlist = null;
const VERDICTS = [
  { v: "si", label: "Sí", icon: "✓", c: "var(--good)" },
  { v: "medias", label: "Más o menos", icon: "~", c: "var(--warning)" },
  { v: "no", label: "No", icon: "✗", c: "var(--critical)" },
];
const vInfo = v => VERDICTS.find(x => x.v === v);
const label = t => `${t.a ? t.a + " – " : ""}${t.t}`;
const FUSION_NAMES = ["violeta", "amarillo", "verde", "rosa"];
const fcolor = c => `var(--fusion-${c % 4})`;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fcss = c => css(`--fusion-${c % 4}`);

// ---------- playlists ----------
let plOf = new Map();
function indexPlaylists() {
  plOf = new Map();
  org.folders.forEach(f => f.playlists.forEach(pl => pl.tracks.forEach(i => plOf.set(i, [f, pl]))));
}
const plName = i => { const x = plOf.get(i); return x ? x[1].name : "—"; };

// ---------- audio ----------
const audio = $("#audio");
const srcOf = t => (APP ? "/audio/" : "") + t.p.split("/").map(encodeURIComponent).join("/");
let nowIdx = null, seq = null, seqTimer = null;
function play(idx, startFrac = 0.4) {
  const t = T[idx]; nowIdx = idx;
  audio.src = srcOf(t);
  audio.addEventListener("loadedmetadata", () => {
    if (isFinite(audio.duration)) audio.currentTime = startFrac * audio.duration;
    audio.play().catch(() => {});
  }, { once: true });
  audio.load();
  $("#now").textContent = label(t);
  $("#nowMenuBtn").disabled = false;
  markPlaying();
}
audio.addEventListener("error", () => { if (audio.src) showAudioWarn(); });
audio.addEventListener("playing", () => { $("#audioWarn").style.display = "none"; $("#pauseBtn").textContent = "Pausa"; });
audio.addEventListener("pause", () => { $("#pauseBtn").textContent = "Reproducir"; });
audio.addEventListener("timeupdate", () => {
  if (seq) $("#prog").value = Math.min(1, (performance.now() - seq.t0) / (seq.secs * 1000));
  else if (audio.duration) $("#prog").value = audio.currentTime / audio.duration;
});
function showAudioWarn() {
  $("#audioWarn").textContent = APP ? "No pude abrir ese archivo de audio (¿se movió o se borró?)."
    : "No encuentro los archivos de audio: esta página tiene que estar dentro de tu carpeta de música y abrirse desde ahí.";
  $("#audioWarn").style.display = "block";
}
function stopSeq() { seq = null; clearTimeout(seqTimer); $("#seqBtn") && ($("#seqBtn").textContent = "▶ Escuchar la playlist de corrido"); }
function seqStep() {
  if (!seq) return;
  if (seq.i >= seq.items.length) { stopSeq(); audio.pause(); return; }
  play(seq.items[seq.i]); seq.t0 = performance.now();
  clearTimeout(seqTimer);
  seqTimer = setTimeout(() => { if (seq) { seq.i += 1; seqStep(); } }, seq.secs * 1000);
}
function startSeq(items) {
  seq = { items, i: 0, secs: +($("#seqSecs")?.value || 20), t0: performance.now() };
  $("#seqBtn").textContent = "■ Detener";
  seqStep();
}
$("#pauseBtn").onclick = () => { if (audio.paused) audio.play().catch(() => {}); else { audio.pause(); stopSeq(); } };
$("#nextBtn").onclick = () => { if (seq) { seq.i += 1; seqStep(); } else if (playlist && nowIdx != null) {
  const i = playlist.tracks.indexOf(nowIdx); if (i >= 0 && i + 1 < playlist.tracks.length) play(playlist.tracks[i + 1]); } };
$("#nowMenuBtn").onclick = e => { if (nowIdx != null) { const r = e.target.getBoundingClientRect(); openMenu(nowIdx, r.left, r.top - 8, true); } };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenu(); if (dialogCancelable) closeDialog(); }
  if (["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName) || $("#overlay").style.display === "flex") return;
  if (e.code === "Space") { e.preventDefault(); $("#pauseBtn").click(); }
  if (e.code === "ArrowRight") { e.preventDefault(); $("#nextBtn").click(); }
});

// ---------- API de la app ----------
async function api(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-App-Token": APP.token }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "Respuesta inválida" }));
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

// ---------- ventanas ----------
let dialogCancelable = true;
function openDialog(title, body, actions, cancelable = true) {
  dialogCancelable = cancelable;
  const d = $("#dialog"); d.replaceChildren(el("h2", { id: "dlgTitle", text: title }), ...[].concat(body));
  if (actions?.length) d.append(el("div", { class: "actions" }, actions));
  $("#overlay").style.display = "flex";
  (d.querySelector("input, button.primary") || d.querySelector("button"))?.focus();
}
function closeDialog() { $("#overlay").style.display = "none"; }
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay" && dialogCancelable) closeDialog(); });
const btn = (text, onclick, primary = false, attrs = {}) => el("button", { class: primary ? "primary" : null, onclick, ...attrs }, text);
function errorDialog(msg) { openDialog("Algo salió mal", [el("p", { text: msg })], [btn("Cerrar", closeDialog, true)]); }

// ---------- fusiones ----------
let drafts = APP ? (APP.drafts || []) : [];
async function saveDrafts() { if (APP) await api("/api/drafts", { fusions: drafts }); }
function fusionsView() {
  // Fusiones aplicadas (con posibles agregados pendientes) y fusiones nuevas pendientes
  const out = (org.fusions || []).map(f => ({ name: f.name, color: f.color, applied: [...f.tracks], pending: [] }));
  drafts.forEach(d => {
    const idxs = d.tracks.map(u => byU.get(u)).filter(i => i != null);
    const target = out.find(f => f.name === d.name && f.applied.length);
    if (target) idxs.forEach(i => { if (!target.applied.includes(i) && !target.pending.includes(i)) target.pending.push(i); });
    else out.push({ name: d.name, color: d.color, applied: [], pending: idxs });
  });
  return out;
}
const fusionOf = i => fusionsView().find(f => f.applied.includes(i) || f.pending.includes(i));
const nextColor = () => { const used = fusionsView().map(f => f.color); for (let c = 0; ; c++) if (!used.includes(c) || c >= 64) return c % 8; };
const pendingReady = () => fusionsView().some(f => f.pending.length && f.applied.length + f.pending.length >= 2);

function createFusion(i) {
  closeMenu();

function watchJob(job, kind) {
  const titles = { add: "Analizando la música nueva", fusions: "Rehaciendo las playlists", export: "Preparando las playlists" };
  const tick = async () => {
    let j;
    try { j = await (await fetch(`/api/job/${job.id}`)).json(); } catch (e) { return setTimeout(tick, 1500); }

}

function plStats(pl) {
  const ts = pl.tracks.map(i => T[i]);
  const bpms = ts.map(t => t.b).filter(b => b != null);
  const count = key => { const m = new Map(); ts.forEach(t => { const k = t[key]; if (k) m.set(k, (m.get(k) || 0) + 1); });
    return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  return { n: ts.length, bpm: bpms.length ? [Math.round(Math.min(...bpms)), Math.round(Math.max(...bpms))] : null,
    genres: count("g").slice(0, 3), folders: count("fs").slice(0, 3), vocal: ts.filter(t => t.v).length,
    fresh: pl.tracks.filter(i => org.flags?.[i] === "nuevo").length };
}

    el("th", { text: "Voz" }), el("th", { text: "Género" }), el("th", { text: "Tu carpeta" }), el("th", { text: "No encaja" }), el("th", { text: "" }))));
  const tb = el("tbody");
  playlist.tracks.forEach((idx, pos) => {
    const t = T[idx], fu = fusionOf(idx);
    const flagged = j.notHere.includes(t.u);
    const cb = el("input", { type: "checkbox", "aria-label": "No encaja en esta playlist" }); cb.checked = flagged;
    cb.onchange = () => { j.notHere = cb.checked ? [...new Set([...j.notHere, t.u])] : j.notHere.filter(u => u !== t.u); save(); renderPlaylist(); };
    const tr = el("tr", { "data-idx": String(idx), class: (flagged ? "flagged" : "") + (idx === nowIdx ? " playing" : "") },
      el("td", { class: "num muted", text: String(pos + 1) }),
      el("td", {}, el("button", { class: "play", "aria-label": "Escuchar", onclick: () => { stopSeq(); play(idx); } }, "▶")),
      el("td", { class: "title" }, t.t,
        org.flags?.[idx] === "nuevo" ? el("span", { class: "flag", text: "agregado recientemente" }) : null,
        fu ? el("span", { class: "flag", title: `En la fusión «${fu.name}»` }, el("span", { class: "swatch", style: `--c:${fcolor(fu.color)}` }), fu.name) : null,
        t.a ? el("small", { text: t.a }) : null),
      el("td", { class: "num", text: t.b != null ? String(Math.round(t.b)) : "" }),
      el("td", { text: t.k || "" }),
      el("td", { class: "num", text: t.e != null ? String(t.e) : "" }),
      el("td", { text: t.v ? "sí" : "" }),
      el("td", { class: "ink2", text: t.g || "" }),
      el("td", { class: "ink2", text: t.fs || "" }),
      el("td", {}, cb),
      el("td", {}, el("button", { class: "more", "aria-label": "Más opciones (fusionar)", title: "Más opciones (también con clic derecho)",
        onclick: e => { const r = e.target.getBoundingClientRect(); openMenu(idx, r.right - 240, r.bottom + 4); } }, "⋯")));
    tr.addEventListener("contextmenu", e => { e.preventDefault(); openMenu(idx, e.clientX, e.clientY); });
    tb.append(tr);
  });
  table.append(tb); card.append(table);
}
function markPlaying() {
  document.querySelectorAll("tr.playing").forEach(r => r.classList.remove("playing"));
  const r = document.querySelector(`tr[data-idx="${nowIdx}"]`); if (r) r.classList.add("playing");
}
function select(f, pl) { folder = f; playlist = pl; stopSeq(); renderSide(); renderPlaylist(); drawMap(); }

// ---------- mapa ----------
function highlighted() {
  const mode = $("#hlSel").value, q = $("#hlText").value.trim().toLowerCase();
  const out = new Set();
  if (mode === "new") Object.entries(org.flags || {}).forEach(([i, f]) => { if (f === "nuevo") out.add(+i); });
  if (mode === "fused") fusionsView().forEach(f => [...f.applied, ...f.pending].forEach(i => out.add(i)));
  if (q.length >= 2) org.trackIdx.forEach(i => { const t = T[i]; if (`${t.a} ${t.t} ${t.fs} ${t.p}`.toLowerCase().includes(q)) out.add(i); });
  return out;
}
function renderLegend() {
  const lg = $("#legend"); lg.replaceChildren(
    el("span", { style: "--c: var(--context-dot)", text: "otros temas" }),
    el("span", { style: "--c: var(--series-1)", text: "carpeta elegida" }),
    el("span", { style: "--c: var(--series-2)", text: "playlist elegida (unidas en orden)" }),
    el("span", { class: "ring", style: "--c: var(--series-3)", text: "lo que pediste mostrar" }));
  fusionsView().forEach(f => lg.append(el("span", { style: `--c:${fcolor(f.color)}`, text: f.name + (f.pending.length ? " (sin aplicar)" : "") })));
}
const canvas = $("#map"), ctx = canvas.getContext("2d"), tip = $("#tip");
let pts = [];
function drawMap() {
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css("--surface-1"); ctx.fillRect(0, 0, W, H);
  const xy = org.xy, pad = 18;
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sx = x => pad + (x - x0) / (x1 - x0 || 1) * (W - 2 * pad), sy = y => H - pad - (y - y0) / (y1 - y0 || 1) * (H - 2 * pad);
  pts = xy.map((p, i) => ({ i, x: sx(p[0]), y: sy(p[1]) }));
  const byTrack = new Map(pts.map(p => [org.trackIdx[p.i], p]));
  const inFolder = new Set(folder ? folder.playlists.flatMap(p => p.tracks) : []);
  const inPl = new Set(playlist ? playlist.tracks : []);
  ctx.fillStyle = css("--context-dot");
  pts.forEach(p => { if (!inFolder.has(org.trackIdx[p.i])) { ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); } });
  const ring = css("--surface-1");
  const dot = (p, r, c) => { ctx.beginPath(); ctx.arc(p.x, p.y, r + 2, 0, 7); ctx.fillStyle = ring; ctx.fill(); ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fillStyle = c; ctx.fill(); };
  inFolder.forEach(ti => { if (!inPl.has(ti)) dot(byTrack.get(ti), 3, css("--series-1")); });
  if (playlist) {
    ctx.strokeStyle = css("--series-2"); ctx.lineWidth = 2; ctx.globalAlpha = 0.5; ctx.beginPath();
    playlist.tracks.forEach((ti, k) => { const p = byTrack.get(ti); if (k) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); });
    ctx.stroke(); ctx.globalAlpha = 1;
    playlist.tracks.forEach(ti => dot(byTrack.get(ti), 4.5, css("--series-2")));
  }
  // Fusiones: unidas por una línea de su color (punteada si falta aplicarla), puntos grandes y el nombre al lado
  fusionsView().forEach(f => {
    const mem = [...f.applied, ...f.pending].map(i => byTrack.get(i)).filter(Boolean);
    if (!mem.length) return;
    const c = fcss(f.color);
    ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.setLineDash(f.pending.length ? [6, 4] : []);
    ctx.beginPath(); mem.forEach((p, k) => k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.setLineDash([]);
    mem.forEach(p => dot(p, 6, c));
    const cx = mem.reduce((s, p) => s + p.x, 0) / mem.length, cy = Math.min(...mem.map(p => p.y)) - 14;
    ctx.font = "600 12px system-ui, sans-serif";
    const text = f.name + (f.pending.length ? " · sin aplicar" : ""), w = ctx.measureText(text).width + 22;
    const lx = Math.max(4, Math.min(cx - w / 2, W - w - 4)), ly = Math.max(4, cy - 18);
    ctx.fillStyle = css("--surface-1"); ctx.strokeStyle = css("--baseline"); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(lx, ly, w, 20, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(lx + 10, ly + 10, 4.5, 0, 7); ctx.fill();
    ctx.fillStyle = css("--ink"); ctx.fillText(text, lx + 18, ly + 14);
  });
  if (playlist) {
    const first = byTrack.get(playlist.tracks[0]);
    ctx.fillStyle = css("--ink"); ctx.font = "600 12px system-ui, sans-serif"; ctx.fillText("inicio", first.x + 8, first.y - 8);
  }
  const hl = highlighted();
  ctx.strokeStyle = css("--series-3"); ctx.lineWidth = 2;
  hl.forEach(ti => { const p = byTrack.get(ti); if (!p) return; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, 7); ctx.stroke(); });
  $("#hlCount").textContent = hl.size ? `${fmt(hl.size)} ${hl.size === 1 ? "tema" : "temas"}` : "";
}
function nearest(mx, my) {
  let best = null, bd = 144;
  pts.forEach(p => { const d = (p.x - mx) ** 2 + (p.y - my) ** 2; if (d < bd) { bd = d; best = p; } });
  return best;
}
canvas.addEventListener("pointermove", e => {
  const r = canvas.getBoundingClientRect(), p = nearest(e.clientX - r.left, e.clientY - r.top);
  if (!p) { tip.style.display = "none"; canvas.style.cursor = "default"; return; }
  const ti = org.trackIdx[p.i], t = T[ti], fu = fusionOf(ti);
  tip.replaceChildren(el("b", { text: label(t) }),
    el("div", { class: "ink2", text: [t.b != null ? `${Math.round(t.b)} BPM` : null, t.k, t.g, t.v ? "con voz" : null].filter(Boolean).join(" · ") }),
    el("div", { class: "muted", text: `Playlist ${plName(ti)}${t.fs ? " · tu carpeta: " + t.fs : ""}${fu ? " · " + fu.name : ""}` }),
    el("div", { class: "muted", text: APP ? "Clic: escuchar · Clic derecho: fusionar" : "Clic: escuchar" }));
  tip.style.display = "block";
  tip.style.left = Math.min(p.x + 14, r.width - tip.offsetWidth - 4) + "px"; tip.style.top = Math.max(0, p.y - tip.offsetHeight - 10) + "px";
  canvas.style.cursor = "pointer";
});
canvas.addEventListener("pointerleave", () => { tip.style.display = "none"; });
canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect(), p = nearest(e.clientX - r.left, e.clientY - r.top);
  if (!p) return;
  const ti = org.trackIdx[p.i], x = plOf.get(ti);
  if (x && x[1] !== playlist) select(x[0], x[1]);
  stopSeq(); play(ti);
});
canvas.addEventListener("contextmenu", e => {
  const r = canvas.getBoundingClientRect(), p = nearest(e.clientX - r.left, e.clientY - r.top);
  if (!p) return;
  e.preventDefault(); tip.style.display = "none";
  openMenu(org.trackIdx[p.i], e.clientX, e.clientY);
});
window.addEventListener("resize", drawMap);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawMap);
$("#hlSel").onchange = drawMap;
$("#hlText").addEventListener("input", drawMap);

// ---------- ayuda y opiniones ----------
function csvCell(v) { const s = v == null ? "" : String(v); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function exportOpinions() {
  const rows = [["organizacion", "org_id", "tipo", "carpeta", "playlist", "opinion", "comentario", "n_temas", "track_uid", "tema", "ruta"]];
  DATA.orgs.forEach(o => o.folders.forEach(f => f.playlists.forEach(pl => {
    const j = state[o.id]?.[pl.id]; if (!j || (!j.verdict && !j.note && !j.notHere.length)) return;
    rows.push([o.label, o.id, "playlist", f.name, pl.name, j.verdict, j.note, pl.tracks.length, "", "", ""]);
    j.notHere.forEach(u => { const t = T.find(x => x.u === u); rows.push([o.label, o.id, "no_encaja", f.name, pl.name, "", "", "", u, t ? `${t.a} - ${t.t}` : "", t ? t.p : ""]); });
  })));
  const blob = new Blob(["﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `opiniones_playlists_${DATA.run_id}.csv` });
  document.body.append(a); a.click(); a.remove();
}
function renderHelp() {
  const h = $("#help"); h.replaceChildren(el("ul", {},
    el("li", {}, el("b", { text: "Para qué sirve: " }), "tu música quedó ordenada en carpetas y playlists por cómo suena. Escuchá algunas (★ = sugeridas) y decí si te convencen."),
    el("li", {}, el("b", { text: "Mapa: " }), "cada punto es un tema; cerca = suenan parecido. Clic en un punto para escucharlo."),
    APP ? el("li", {}, el("b", { text: "Agregar música nueva: " }), "elegís una carpeta, se analiza y los temas se ubican en tus playlists. El interruptor «Mantener la organización actual» decide si lo que ya está se queda quieto (encendido) o se reorganiza todo (apagado).") : null,
    APP ? el("li", {}, el("b", { text: "Fusiones de temas: " }), "si dos o más temas tienen que ir juntos, hacé clic derecho sobre cada uno (o tocá ⋯) y creá una fusión o agregalos a una existente. Después, «Rehacer las playlists con las fusiones».") : null,
    APP ? el("li", {}, el("b", { text: "Para tocar: " }), "«Preparar para Rekordbox y Traktor» genera los archivos y te dice cómo importarlos.") : null,
    el("li", {}, el("b", { text: "Teclado: " }), "espacio = pausa, → = tema siguiente."),
    el("li", {}, "Tus opiniones se guardan en este navegador. ", el("a", { href: "#", onclick: e => { e.preventDefault(); exportOpinions(); } }, "Descargarlas (CSV)"))));
}
$("#helpBtn").onclick = () => { const h = $("#help"); h.hidden = !h.hidden; $("#helpBtn").setAttribute("aria-expanded", String(!h.hidden)); };

// ---------- inicio ----------
function selectFirstSuggested() {
  folder = null; playlist = null;
  for (const f of org.folders) { const pl = f.playlists.find(p => p.suggested); if (pl) { folder = f; playlist = pl; return; } }
}
function refresh() { renderToolbar(); renderSide(); renderFusions(); renderLegend(); renderPlaylist(); drawMap(); }
const orgSel = $("#orgSel");
DATA.orgs.forEach((o, i) => orgSel.append(el("option", { value: String(i), text: o.label })));
if (DATA.orgs.length > 1) $("#orgSelWrap").hidden = false;
orgSel.onchange = () => { org = DATA.orgs[+orgSel.value]; indexPlaylists(); selectFirstSuggested(); stopSeq(); refresh(); };
indexPlaylists();
selectFirstSuggested();
const show = sessionStorage.getItem("traktor_show");
if (show) { $("#hlSel").value = show; sessionStorage.removeItem("traktor_show"); }
renderHelp(); refresh(); save();
if (firstVisit) { $("#help").hidden = false; $("#helpBtn").setAttribute("aria-expanded", "true"); }
(() => { const probe = new Audio(); probe.preload = "metadata"; probe.onerror = showAudioWarn; probe.src = srcOf(T[0]); })();
</script>
