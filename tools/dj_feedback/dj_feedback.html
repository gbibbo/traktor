<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anotador DJ</title>
<style>
  body{margin:0;padding:16px 16px 90px;background:#f6f5f2;color:#1c1b19;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1{font-size:20px;margin:0 0 12px}
  h2{font-size:16px;margin:24px 0 8px}
  p{margin:0 0 10px;color:#5d5a54}
  .box{background:#fff;border:1px solid #e3e0d9;border-radius:10px;padding:14px;margin-bottom:12px}
  .track{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee}
  .track:last-child{border-bottom:0}
  .tag{min-width:80px;font-weight:600;color:#0f6b5c}
  .name{flex:1;word-break:break-word}
  button{font:inherit;border:1px solid #d5d2cb;background:#fff;color:#1c1b19;border-radius:8px;padding:8px 14px;cursor:pointer}
  button.play{padding:4px 10px}
  button.answer{background:#0f6b5c;border-color:#0f6b5c;color:#fff;font-weight:600}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .muted{color:#8a877f;font-size:13px}
  input[type=text]{font:inherit;border:1px solid #d5d2cb;border-radius:8px;padding:6px 8px;width:100%;max-width:360px}
  .list{max-height:400px;overflow:auto}
  .player{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e0d9;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .player .now{flex:1 1 200px;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player input[type=range]{flex:1 1 200px;min-width:120px}
  #folderRow{display:none}
</style>
</head>
<body>
<h1>Anotador DJ</h1>

<div class="box" id="srcBox">
  <span id="srcStatus" class="muted">Buscando los archivos de audio junto a esta página…</span>
  <div id="folderRow"><input type="file" id="folderPick" webkitdirectory multiple hidden>
    <button id="folderBtn">Elegir la carpeta de música</button></div>
</div>

<div class="box">
  <p><b>Pregunta:</b> ¿cuál de los dos candidatos pondrías en la misma carpeta que el ancla? Si no podés decidir, saltá. Tu avance se guarda solo en este navegador.</p>
  <div id="progress" class="muted"></div>
  <div id="question"></div>
  <div class="actions" id="answers">
    <button class="answer" id="ansB">Candidato B se parece más</button>
    <button class="answer" id="ansC">Candidato C se parece más</button>
    <button id="ansSkip">No sé, saltar</button>
    <button id="back">Volver a la anterior</button>
  </div>
  <div class="actions">
    <button id="download">Descargar respuestas (CSV)</button>
  </div>
</div>

<h2>Todos los temas</h2>
<div class="box">
  <input type="text" id="filter" placeholder="Filtrar por nombre">
  <div class="list" id="list"></div>
</div>

<div class="player">
  <button id="pPlay">Reproducir</button>
  <span class="now" id="pNow">Nada sonando</span>
  <input type="range" id="pBar" min="0" max="1000" value="0">
  <span class="muted" id="pTime">0:00</span>
  <audio id="audio" preload="none"></audio>
</div>

o Lio, Harvey McKay - Droid Decay.mp3", "c": "Djuma Soundsystem, NenaHalena - Rim Jhim.mp3"}, {"id": "Q052", "a": "Carbon - Go Through That.mp3", "b": "Dhillon - Intro.mp3", "c": "Redsea (IT) - Around My Head (The Drifter Remix).mp3"}, {"id": "Q053", "a": "Maksim Dark - Energize.mp3", "b": "Lopezhouse - Motorik (Original Mix).mp3", "c": "Djuma Soundsystem, NenaHalena - Rim Jhim.mp3"}, {"id": "Q054", "a": "Rex the Dog - Vortex (Krystal Klear Remix).mp3", "b": "Matador, ARTBAT - Visitor.mp3", "c": "Innellea - Prospective Vision.mp3"}, {"id": "Q055", "a": "VSY - Find Me.mp3", "b": "Matador, ARTBAT - Visitor.mp3", "c": "Hunter Game - Silver (Silence Live Mix).mp3"}, {"id": "Q056", "a": "Gorgon City - Roped In.mp3", "b": "Darren Emerson - Hot dog (Florian Meindl Remix).mp3", "c": "Carbon - Go Through That.mp3"}, {"id": "Q057", "a": "Khen - Out Of A Dream.mp3", "b": "Josh Wink - Higher State Of Consciousness (Adana Twins Remix Two).mp3", "c": "BOg, GHEIST, Fideles - Venere (Fideles Remix).mp3"}, {"id": "Q058", "a": "Robert Babicz - Shifting Reality.mp3", "b": "Alex Dimou - What Keeps You There (Cevin Fisher Remix).mp3", "c": "Timo Maas - The Religion of Love (Kotelett Bonus Mix) (Kotelett Bonus Mix) myfreemp3.vip .mp3"}, {"id": "Q059", "a": "Black Girl _ White Girl - Green Crack.mp3", "b": "Christopher Kah - Thrust.mp3", "c": "Monkey Safari - Chari Chari.mp3"}, {"id": "Q060", "a": "Christos Fourkis - Black Rat.mp3", "b": "Sandy Rivera, Rae - Hide U (Chicola Extended Remix).wav", "c": "Oliver Lieb - Oasis 2020 (Frankyeffe Remix).mp3"}];   // [{id, a, b, c}] fija, generada al construir la página
const KEY = "dj_feedback_min_v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stem = f => f.replace(/\.[^.]+$/, "");

let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
function saveAnswers(){ try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch(e) {} }
let i = QUEUE.findIndex(q => !answers[q.id]); if (i < 0) i = QUEUE.length;

// --- audio ---
const files = new Map();
const src = name => files.has(name) ? files.get(name) : encodeURIComponent(name);
const probe = new Audio(); probe.preload = "metadata";
probe.onloadedmetadata = () => { $("#srcStatus").textContent = "Audio listo (archivos de esta carpeta)."; };
probe.onerror = () => { $("#srcStatus").textContent = "No encuentro los mp3 junto a esta página. Copiá el HTML a la carpeta de música o elegí la carpeta:"; $("#folderRow").style.display = "block"; };
probe.src = src(TRACKS[0]);
$("#folderBtn").onclick = () => $("#folderPick").click();
$("#folderPick").onchange = e => { files.clear(); for (const f of e.target.files) files.set(f.name, URL.createObjectURL(f));
  const n = TRACKS.filter(t => files.has(t)).length; $("#srcStatus").textContent = `Carpeta elegida: ${n} de ${TRACKS.length} temas encontrados.`; };

const audio = $("#audio"); let current = null;
function play(name){
  if (current !== name){ audio.src = src(name); current = name; $("#pNow").textContent = stem(name);
    audio.addEventListener("loadedmetadata", () => { audio.currentTime = 0.35 * audio.duration; audio.play().catch(()=>{}); }, {once:true}); audio.load(); }
  else audio.play().catch(()=>{});
}
audio.onplay = () => $("#pPlay").textContent = "Pausa";
audio.onpause = () => $("#pPlay").textContent = "Reproducir";
audio.ontimeupdate = () => { if (audio.duration){ $("#pBar").value = Math.round(1000 * audio.currentTime / audio.duration); $("#pTime").textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration); } };
$("#pBar").oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
$("#pPlay").onclick = () => { if (!current) return; audio.paused ? audio.play() : audio.pause(); };
function fmt(s){ s = Math.floor(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
document.addEventListener("click", e => { const b = e.target.closest("[data-play]"); if (b) play(b.dataset.play); });
const row = (tag, name) => `<div class="track"><span class="tag">${tag}</span><button class="play" data-play="${esc(name)}">▶</button><span class="name">${esc(stem(name))}</span></div>`;

// --- questions ---
function render(){
  const q = QUEUE[i];
  const done = Object.keys(answers).length;
  if (!q){ $("#question").innerHTML = `<p>Terminaste las ${QUEUE.length} preguntas. Descargá el CSV.</p>`; $("#progress").textContent = ""; $("#answers").style.display = "none"; return; }
  $("#answers").style.display = "";
  $("#progress").textContent = `Pregunta ${i + 1} de ${QUEUE.length} · respondidas ${done}` + (answers[q.id] ? ` · ya respondida: ${answers[q.id].answer}` : "");
  $("#question").innerHTML = row("Ancla", q.a) + row("Candidato B", q.b) + row("Candidato C", q.c);
}
function answer(v){ const q = QUEUE[i]; if (!q) return; answers[q.id] = {answer: v, at: new Date().toISOString()}; saveAnswers(); i++; render(); }
$("#ansB").onclick = () => answer("B"); $("#ansC").onclick = () => answer("C"); $("#ansSkip").onclick = () => answer("skip");
$("#back").onclick = () => { if (i > 0){ i--; render(); } };
$("#download").onclick = () => {
  const cell = v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const lines = ["question_id,anchor,candidate_b,candidate_c,answer,answered_at"];
  for (const q of QUEUE){ const a = answers[q.id]; if (a) lines.push([q.id, q.a, q.b, q.c, a.answer, a.at].map(cell).join(",")); }
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tripletas_respuestas.csv"; document.body.appendChild(a); a.click(); a.remove();
};

// --- list ---
function renderList(){ const f = $("#filter").value.toLowerCase(); $("#list").innerHTML = TRACKS.filter(t => !f || t.toLowerCase().includes(f)).map(t => row("", t)).join(""); }
$("#filter").oninput = renderList;
render(); renderList();
</script>
